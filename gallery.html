<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギャラリー | 靴ノート</title>
<meta name="description" content="靴をテーマに描いた漫画やイラストを並べたギャラリー。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000;
  --text: #fff;
  --muted: #b5b5b5;
  --line: #2a2a2a;
  --orange: #fa5400;
  --blue: #2d7bff;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: var(--body); line-height: 1.8; -webkit-text-size-adjust: 100%; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

.site-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 18px 5vw; border-bottom: 1px solid var(--line); }
.logo { font-family: var(--display); font-size: 1.35rem; letter-spacing: .04em; }
.logo span { color: var(--orange); }
.nav { display: flex; gap: 22px; flex-wrap: wrap; }
.nav a { font-weight: 700; padding: 4px 0; border-bottom: 3px solid transparent; }
.nav a:hover { border-bottom-color: var(--orange); }
.nav a[aria-current="page"] { border-bottom-color: var(--blue); }

.page-head { position: relative; overflow: hidden; padding: 64px 5vw 48px; border-bottom: 1px solid var(--line); }
.page-head::after {
  content: "";
  position: absolute;
  top: 0; right: 6vw;
  width: 90px; height: 100%;
  background: var(--blue);
  transform: skewX(-24deg);
  box-shadow: -130px 0 0 var(--blue), 130px 0 0 var(--blue);
  opacity: .9;
}
.page-head h1 { position: relative; z-index: 1; font-family: var(--display); font-weight: 400; font-size: clamp(2.2rem, 6vw, 3.6rem); line-height: 1.2; }
.page-head p { position: relative; z-index: 1; margin-top: 10px; color: var(--muted); max-width: 28em; }
.page-head .bar { display: block; width: 72px; height: 8px; background: var(--orange); border-radius: 4px; margin-top: 18px; position: relative; z-index: 1; }

/* 絞り込み */
.filters { display: flex; gap: 10px; flex-wrap: wrap; padding: 32px 5vw 0; }
.filter {
  font: inherit;
  font-weight: 700;
  color: var(--text);
  background: transparent;
  border: 2px solid var(--line);
  border-radius: 999px;
  padding: 8px 22px;
  cursor: pointer;
}
.filter:hover { border-color: var(--blue); }
.filter[aria-pressed="true"] { background: var(--orange); border-color: var(--orange); color: #000; }

/* 作品グリッド */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 28px 5vw 72px; align-items: start; }
.work[hidden] { display: none; }
.work figure { margin: 0; }
.frame {
  display: flex;
  align-items: flex-end;
  padding: 16px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: #0d0d0d;
  color: var(--muted);
  font-weight: 700;
  overflow: hidden;
}
.frame img { display: block; width: 100%; height: 100%; object-fit: cover; }
.work[data-type="manga"] .frame { aspect-ratio: 3 / 4; border-bottom: 5px solid var(--orange); }
.work[data-type="illust"] .frame { aspect-ratio: 1 / 1; border-bottom: 5px solid var(--blue); }
.work figcaption { margin-top: 10px; }
.work .title { font-weight: 700; }
.work .kind { font-size: .85rem; color: var(--muted); }

.note { padding: 0 5vw 56px; color: var(--muted); font-size: .9rem; margin-top: -40px; }

.site-footer { padding: 30px 5vw 40px; color: var(--muted); font-size: .9rem; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); }

@media (max-width: 860px) { .grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 720px) { .page-head::after { right: -20px; opacity: .55; } }
@media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>

<header class="site-header">
  <a class="logo" href="index.html">靴<span>ノート</span></a>
  <nav class="nav" aria-label="メインメニュー">
    <a href="index.html">トップ</a>
    <a href="blog.html">ブログ</a>
    <a href="gallery.html" aria-current="page">ギャラリー</a>
    <a href="about.html">このサイトについて</a>
  </nav>
</header>

<main>
  <section class="page-head">
    <h1>ギャラリー</h1>
    <p>靴をテーマに描いた漫画とイラストを並べています。</p>
    <span class="bar"></span>
  </section>

  <div class="filters" role="group" aria-label="作品の種類で絞り込む">
    <button class="filter" type="button" data-filter="all" aria-pressed="true">すべて</button>
    <button class="filter" type="button" data-filter="manga" aria-pressed="false">漫画</button>
    <button class="filter" type="button" data-filter="illust" aria-pressed="false">イラスト</button>
  </div>

  <!--
    作品の画像を入れるときは、.frame の中の文字を
    <img src="images/ファイル名.jpg" alt="作品の説明"> に差し替えてね。
    作品を足すときは <article class="work"> ごとコピー。
    漫画は data-type="manga"、イラストは data-type="illust"。
  -->
  <section class="grid" aria-label="作品一覧">
    <article class="work" data-type="manga">
      <figure>
        <div class="frame">画像を入れる</div>
        <figcaption><div class="title">作品タイトル1</div><div class="kind">漫画</div></figcaption>
      </figure>
    </article>
    <article class="work" data-type="illust">
      <figure>
        <div class="frame">画像を入れる</div>
        <figcaption><div class="title">作品タイトル2</div><div class="kind">イラスト</div></figcaption>
      </figure>
    </article>
    <article class="work" data-type="illust">
      <figure>
        <div class="frame">画像を入れる</div>
        <figcaption><div class="title">作品タイトル3</div><div class="kind">イラスト</div></figcaption>
      </figure>
    </article>
    <article class="work" data-type="manga">
      <figure>
        <div class="frame">画像を入れる</div>
        <figcaption><div class="title">作品タイトル4</div><div class="kind">漫画</div></figcaption>
      </figure>
    </article>
    <article class="work" data-type="illust">
      <figure>
        <div class="frame">画像を入れる</div>
        <figcaption><div class="title">作品タイトル5</div><div class="kind">イラスト</div></figcaption>
      </figure>
    </article>
    <article class="work" data-type="manga">
      <figure>
        <div class="frame">画像を入れる</div>
        <figcaption><div class="title">作品タイトル6</div><div class="kind">漫画</div></figcaption>
      </figure>
    </article>
  </section>
</main>

<footer class="site-footer">
  <span>&copy; 2026 靴ノート</span>
  <span><a href="index.html">トップ</a> / <a href="blog.html">ブログ</a> / <a href="about.html">このサイトについて</a></span>
</footer>

<script>
(function () {
  var buttons = document.querySelectorAll(".filter");
  var works = document.querySelectorAll(".work");
  buttons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      var type = btn.getAttribute("data-filter");
      buttons.forEach(function (b) { b.setAttribute("aria-pressed", b === btn ? "true" : "false"); });
      works.forEach(function (w) {
        w.hidden = !(type === "all" || w.getAttribute("data-type") === type);
      });
    });
  });
})();
</script>

</body>
</html>
